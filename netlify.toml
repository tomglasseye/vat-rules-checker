# VAT Rules Checker: React Router app on Netlify Functions, Postgres on Supabase (DATABASE_URL).
# New migrations in db/migrations are applied to Supabase before each build.
[build]
command = "npm run db:migrate && npm run build"
publish = "build/client"

[build.environment]
NODE_VERSION = "24"

[dev]
command = "react-router dev"
